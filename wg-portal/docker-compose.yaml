services:
  wg-portal:
    image: wgportal/wg-portal:latest
    container_name: wg-portal
    restart: unless-stopped
    environment:
      WG_PORTAL_CORE_ADMIN_USER: ${WG_ADMIN_USER}
      WG_PORTAL_CORE_ADMIN_PASSWORD: ${WG_ADMIN_PASSWORD}
      WG_PORTAL_CORE_DISABLE_ADMIN_USER: "false"
      WG_PORTAL_WEB_EXTERNAL_URL: ${WG_WEB_URL}
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./data:/app/data             
      - ./config:/app/config         
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
      - "8888:8888/tcp"              
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
